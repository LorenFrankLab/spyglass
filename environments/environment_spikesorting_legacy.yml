# Test-only env for the v0/v1 spike sorting suites (SpikeInterface 0.99).
# Relax pyproject's SI pins first, as the pytest-legacy CI job does:
#   sed -i \
#     -e 's/"spikeinterface==0.104.3"/"spikeinterface>=0.99.1,<0.100"/' \
#     -e 's/"probeinterface>=0.3.2"/"probeinterface>=0.2.19,<0.3"/' \
#     pyproject.toml
name: spyglass_spikesorting_legacy
channels:
  - conda-forge
  - franklab
  - edeno
dependencies:
  - python=3.10
  - numpy<2  # spikeinterface 0.99.x calls np.issctype, removed in numpy 2.0
  - pybind11  # req by mountainsort4 -> isosplit5
  - pytorch<1.12.0
  - pip
  - pip:
      - "numpy<2"  # also on the pip layer, so pip cannot upgrade past it
      - mountainsort4
      - --editable "..[test,spikesorting]"
