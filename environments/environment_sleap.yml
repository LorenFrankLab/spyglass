# Position pipeline environment — SLEAP (sleap-nn / PyTorch backend)
#
# 1. Install the correct GPU driver for your machine.
#    See https://stackoverflow.com/a/30820690
# 2. Create the environment:
#      mamba env create -f environments/environment_sleap.yml
#    Update an existing install:
#      mamba env update -f environments/environment_sleap.yml
# 3. Activate:
#      conda activate spyglass-sleap
#
#
# Note: SLEAP cannot share this environment due to conflicts with DLC 3.X
#       For DLC, use the separate environments/environment_dlc.yml
#
# MIGRATING FROM POSITION V1: create a FRESH environment from this file — do
#       NOT reuse, clone, or `env update` onto a Position-V1 environment.
name: spyglass-sleap
channels:
  # - defaults # DLC only
  - conda-forge
  # - pytorch # DLC only
  - franklab
  - edeno
dependencies:
  - bottleneck
  - ffmpeg
  - ipympl
  - jupyterlab>=3.*
  - matplotlib
  - non_local_detector
  # - numpy # DLC only
  - pip>=20.2.*
  # - scipy<1.13
  - position_tools
  - pybind11
  - pydotplus>=2.0.*
  - pyfftw<=0.12.0
  - python>=3.11,<3.14
  - pytorch>=2.0 # DLC only
  - ripple_detection
  - seaborn
  - torchvision # DLC only
  - track_linearization>=2.3
  - pip:
      # - jax>=0.4.38,<0.5 # DLC only
      # - jaxlib>=0.4.38,<0.5 # DLC only
      # - ghostipy # LFP only
      # - mountainsort4 # spike-sorting only
      - ..[sleap] # responsible for installing torch(vision). Do not add
