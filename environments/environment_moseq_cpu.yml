# 1. Install a conda distribution.
#    https://mamba.readthedocs.io/en/latest/installation/mamba-installation.html
# 2. Run: `mamba env create -f environment.yml`
# 3. Activate: `conda activate spyglass`
#
# (lines intentionally left blank)
#
#
name: spyglass-moseq-cpu
channels:
  - conda-forge
  # - defaults # deprecated
  - franklab
  - edeno
  # - pytorch # dlc-only
  # - anaconda  # dlc-only, for cudatoolkit
dependencies:
  - bottleneck
  # - cudatoolkit=11.3 # dlc-only
  # - ffmpeg # dlc-only
  - ipympl
  - jax<0.7.2  # jax 0.7.2 requires numpy>=2/scipy>=1.13
  - jupyterlab>=3.*
  # - libgcc # dlc-only
  - matplotlib
  - non_local_detector
  - numpy<2  # spikeinterface 0.99.1 calls np.issctype, removed in numpy 2.0
  - pip
  - scipy<1.13  # spikeinterface 0.99.x uses scipy.linalg.tril, removed in 1.13
  - position_tools
  - pybind11  # req by mountainsort4 -> isosplit5
  - pydotplus
  - python>=3.10,<3.13
  - pytorch<1.12.0
  - ripple_detection
  - seaborn
  # - torchaudio # dlc-only
  # - torchvision # dlc-only
  - track_linearization>=2.3
  - pip:
      - mountainsort4
      - ..[moseq-cpu]
