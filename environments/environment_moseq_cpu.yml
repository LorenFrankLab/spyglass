# 1. Install a conda distribution.
#    https://mamba.readthedocs.io/en/latest/installation/mamba-installation.html
# 2. Run: `mamba env create -f environment.yml`
# 3. Activate: `conda activate spyglass`
#
# (lines intentionally left blank)
#
#
name: spyglass-moseq-cpu
channels:
  - conda-forge
  # - defaults # deprecated
  - franklab
  - edeno
  # - pytorch # dlc-only
  # - anaconda  # dlc-only, for cudatoolkit
dependencies:
  - bottleneck
  # - cudatoolkit=11.3 # dlc-only
  # - ffmpeg # dlc-only
  - ipympl
  - jupyterlab>=3.*
  # - libgcc # dlc-only
  - matplotlib
  - non_local_detector
  - numpy<2  # deeplabcut 3.x and keypoint-moseq 0.6 require numpy<2; the v2 spike-sorting lane is environment.yml / environment_spikesorting_v2.yml
  - pip
  - position_tools
  - pybind11  # req by mountainsort4 -> isosplit5
  - pydotplus
  - python>=3.10,<3.13
  - ripple_detection
  - scipy>=1.13
  - seaborn
  # - torchaudio # dlc-only
  # - torchvision # dlc-only
  - track_linearization>=2.3
  - pip:
      - mountainsort4
      - ..[moseq-cpu]
