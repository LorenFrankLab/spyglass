# 1. Install a conda distribution.
#    https://mamba.readthedocs.io/en/latest/installation/mamba-installation.html
# 2. Run: `mamba env create -f environment.yml`
# 3. Activate: `conda activate spyglass`
#
# (lines intentionally left blank)
#
#
name: spyglass
channels:
  - conda-forge
  # - defaults # deprecated
  - franklab
  - edeno
  # - pytorch # dlc-only
  # - anaconda  # dlc-only, for cudatoolkit
dependencies:
  - bottleneck
  # - cudatoolkit=11.3 # dlc-only
  # - ffmpeg # dlc-only
  - ipympl
  - jax<0.10  # NLD 0.6.9 uses clip(a_min=, a_max=), removed in 0.10
  - jupyterlab>=3.*
  # - libgcc # dlc-only
  - matplotlib
  - non_local_detector==0.6.9
  - numpy>=2,<3
  - pip
  - position_tools
  - pydotplus
  - python>=3.10,<3.13
  - ripple_detection
  - scipy>=1.13  # numpy>=2; SI 0.104 needs scipy>=1.13
  - seaborn
  # - torchaudio # dlc-only
  # - torchvision # dlc-only
  - track_linearization>=2.3
  - pip:
      - torch>=2  # pip, not conda: conda pytorch>=2 forces numpy<2
      - ..  # ..[spikesorting-v2] adds MountainSort4/5
