# Position pipeline environment — DeepLabCut (DLC 3.0+ / PyTorch backend)
#
# 1. Install the correct GPU driver for your machine.
#    See https://stackoverflow.com/a/30820690
# 2. Create the environment:
#      mamba env create -f environments/environment_dlc.yml
#    Update an existing install:
#      mamba env update -f environments/environment_dlc.yml
# 3. Activate and configure:
#      conda activate spyglass-dlc3
#      mamba env config vars set LD_LIBRARY_PATH=~/path/to/mambaforge/envs/spyglass-dlc/lib/
#
# Note: SLEAP cannot share this environment due to conflicts with DLC 3.X
#       For SLEAP, use the separate environments/environment_sleap.yml
#
# MIGRATING FROM POSITION V1: create a FRESH environment from this file — do
#       NOT reuse, clone, or `env update` onto a Position-V1 environment.
name: spyglass-dlc3
channels:
  - defaults
  - conda-forge
  - pytorch
  - franklab
  - edeno
dependencies:
  - bottleneck
  - ffmpeg
  - ipympl
  - jupyterlab>=3.*
  - matplotlib
  - non_local_detector
  - numpy
  - pip>=20.2.*
  - scipy<1.13  # spikeinterface 0.99.x uses scipy.linalg.tril, removed in 1.13
  - position_tools
  - pybind11
  - pydotplus>=2.0.*
  - pyfftw<=0.12.0
  - python>=3.10,<3.13
  - pytorch>=2.0
  - ripple_detection
  - seaborn
  - torchvision
  - track_linearization>=2.3
  - pip:
      - jax>=0.4.38,<0.5 # pulled by non_local_detector, restricted bc numpy<
      - jaxlib>=0.4.38,<0.5
      # - ghostipy      # LFP-only; bundled w/ ..[dlc] risks masking pip failures -- install separately
      # - mountainsort4 # spike-sorting only; same reason -- install separately
      - ndx-pose>=0.2.0
      - ..[dlc]
