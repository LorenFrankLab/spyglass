# 1. INSTALL CORRECT DRIVER for your GPU-equipped machine.
#    see https://stackoverflow.com/questions/30820513/what-is-the-correct-version-of-cuda-for-my-nvidia-driver/30820690
# 2. install: mamba env create -f environment_dlc.yml
#    update existing install:  mamba env update -f environment_dlc.yml
# 2. After installing...
#    run: conda activate spyglass-dlc
#    run: mamba env config vars set LD_LIBRARY_PATH=~/path/to/<anaconda3 or mambaforge>/envs/spyglass-position/lib/
#    run: mamba install -c conda-forge wxpython
name: spyglass-dlc
channels:
  - conda-forge
  # - defaults # deprecated
  - franklab
  - edeno
  - pytorch   # dlc-only
  - anaconda  # dlc-only, for cudatoolkit
dependencies:
  - bottleneck
  - cudatoolkit=11.3   # dlc-only
  - ffmpeg   # dlc-only
  - ipympl
  - jupyterlab>=3.*
  - libgcc   # dlc-only
  - matplotlib
  - non_local_detector
  - numpy<2  # deeplabcut 3.x and keypoint-moseq 0.6 require numpy<2; the v2 spike-sorting lane is environment.yml / environment_spikesorting_v2.yml
  - pip>=20.2.*
  - position_tools
  - pybind11  # req by mountainsort4 -> isosplit5
  - pydotplus>=2.0.*
  - python>=3.10,<3.13
  - ripple_detection
  - scipy>=1.13
  - seaborn
  - track_linearization>=2.3
  - pip:
      # torch and torchvision arrive through pip as deeplabcut
      # dependencies rather than from conda: DeepLabCut 3.x needs
      # torch>=2, which the conda ``pytorch<1.12`` pin this file used to
      # carry cannot satisfy. The ``..[dlc]`` install below pulls the
      # matching wheels.
      - mountainsort4
      - ..[dlc]
