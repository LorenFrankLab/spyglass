[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "spyglass-neuro"
description = "Neuroscience data analysis framework for reproducible research"
readme = "README.md"
keywords = [
  "data analysis",
  "datajoint",
  "electrophysiology",
  "kachery",
  "neuroscience",
  "nwb",
  "reproducible",
  "research",
  "sortingview",
  "spike sorting",
  "spikeinterface",
]
license = { file = "LICENSE" }
authors = [
  { name = "Loren Frank", email = "loren.frank@ucsf.edu" },
  { name = "Kyu Hyun Lee", email = "kyuhyun.lee@ucsf.edu" },
  { name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" },
  { name = "Ryan Ly", email = "rly@lbl.gov" },
  { name = "Daniel Gramling", email = "daniel.gramling@ucsf.edu" },
  { name = "Chris Brozdowski", email = "chris.broz@ucsf.edu" },
  { name = "Samuel Bray", email = "sam.bray@ucsf.edu" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [ "version" ]
dependencies = [
  "black[jupyter]>26",
  "bottleneck",
  "dask",
  "datajoint>=0.14.5,<2.0",
  "fsspec",                       # Streaming reads; was an undeclared transitive
  "hdmf>=3.4.6",
  "ipympl",
  "matplotlib",
  "ndx-franklab-novela>=0.2.4",
  # 0.4.0 changed the spec; common_optogenetics reads the 0.3.x layout
  "ndx-ophys-devices>=0.3.1,<0.4",
  "ndx-optogenetics==0.3.0",
  "ndx-pose",
  "networkx",                       # imported by utils.dj_graph
  "non-local-detector==0.6.9",
  # NLD 0.6.9 uses clip(a_min=, a_max=), removed in JAX 0.10.
  "jax<0.10",
  # v2 extras pin numpy>=2; DeepLabCut and keypoint-moseq 0.6 need numpy<2.
  "numpy>=1.26,<3",
  "opencv-python",
  "position-tools>=0.1",
  "psutil",                        # Detects available RAM for the NWB cache
  "pydotplus",
  "pynwb>=3.1.3",
  "requests",                      # Shared-storage broker API
  "ripple-detection>=1.7",         # normalization API used by spyglass.mua
  "scipy>=1.13",                   # direct import; floor matches conda envs
  "seaborn",
  "track-linearization>=2.3",
]

optional-dependencies.dlc = [
  "deeplabcut[tf]<3", # Pending position V2
  "ffmpeg",
]
optional-dependencies.docs = [
  "hatch",                  # Get version from env
  "jupytext",               # Convert notebooks to .py
  "mike",                   # Docs versioning
  "mkdocs",                 # Docs core
  "mkdocs-exclude",         # Docs exclude files
  "mkdocs-exclude-search",  # Docs exclude files in search
  "mkdocs-gen-files",       # Docs API generator
  "mkdocs-jupyter",         # Docs render notebooks
  "mkdocs-literate-nav",    # Dynamic page list for API docs
  "mkdocs-material",        # Docs theme
  "mkdocs-mermaid2-plugin", # Docs mermaid diagrams
  "mkdocstrings[python]",   # Docs API docstrings
]
# Deprecated alias for kachery-legacy, kept so an existing install command
# does not break during the deprecation cycle. Removed with the extra itself.
optional-dependencies.kachery-cloud = [
  "spyglass-neuro[kachery-legacy]",
]
# Deprecated in 0.6.1, removed in 0.7.0. Superseded by the shared-storage
# broker; nothing in the default install depends on these.
optional-dependencies.kachery-legacy = [
  "kachery",
  "kachery-client",
  "kachery-cloud>=0.4",
]
optional-dependencies.moseq-cpu = [
  "jax[cpu]",
  "jax-moseq",
  "keypoint-moseq>=0.6",
]
optional-dependencies.moseq-gpu = [
  "jax[cuda12]",
  "jax-moseq[cuda12]",
  "keypoint-moseq>=0.6",
]
# Spike sorting, MUA, and sorted-spikes or clusterless decoding.
optional-dependencies.spikesorting = [
  "numba",                  # clusterless peaks, burst correlograms
  "probeinterface>=0.3.2",  # required by spikeinterface 0.104
  "pydantic>=2",            # spikesorting v2 parameter models
  "sortingview>=0.11",
  "spikeinterface==0.104.3", # a bump shifts untyped sorter defaults;
                             # see test_*_si_defaults_unchanged
]
optional-dependencies.spikesorting-v2 = [
  "spyglass-neuro[spikesorting]",
  # analyzer/cache locks; >=3.15 makes is_singleton locks reentrant
  "filelock>=3.15",
  "threadpoolctl>=3", # structured native-thread runtime receipts
  "mountainsort4==1.0.7", # version exercised by the real-sort test
  "mountainsort5>=0.5", # v2 alternative; pulls isosplit6 + scikit-learn
  "numpy>=2,<3", # torch>=2 + SI 0.104 resolve on numpy 2
  "torch>=2", # DriftEstimate dredge_fast preset; 2.x supports numpy 2
]
optional-dependencies.spikesorting-v2-matching = [
  "spyglass-neuro[spikesorting]",
  "filelock>=3.15", # existing-sort analyzer reads use the shared cache lock
  "threadpoolctl>=3", # structured native-thread runtime receipts
  # <3.2.8: later releases pin numpy<2. 3.2.7 still needs the numpy-2 shim in
  # _matching.unitmatch_backend.
  "UnitMatchPy>=3.2.6,<3.2.8",
  "mat73",                     # UnitMatchPy reads MATLAB .mat exports
  "numpy>=2,<3",               # UnitMatchPy <3.2.8 and the v2 SI stack
]
optional-dependencies.spikesorting-v2-curation = [
  "spyglass-neuro[spikesorting]",
  "filelock>=3.15", # shared analyzer locks and atomic draft revision checks
  "threadpoolctl>=3", # structured native-thread runtime receipts
  # review extension uses these FigPack APIs; re-test browser review to bump
  "figpack==0.3.20",
  "figpack-spike-sorting==0.1.14",
  "ipywidgets>=8,<9", # guided notebook preview, conflict resolution, and commit
]
optional-dependencies.spikesorting-v2-curation-test = [
  # browser review tests; then run ``playwright install chromium``
  "playwright==1.55.0",
]
optional-dependencies.spikesorting-v2-validation = [
  # MEArec pulls elephant, which needs numpy>=2
  "MEArec>=1.9",       # ground-truth simulated recordings
  "neuroconv[mearec]", # MEArec -> NWB conversion
  "nwbinspector",      # NWBInspector validation of the generated fixture NWB
]
optional-dependencies.test = [
  "codecov",                # for code coverage badge
  "docker",                 # for tests in a container
  "kachery",                # database access
  "kachery-client",
  "kachery-cloud>=0.4",
  "netcdf4",                # for decoding mocking
  "opencv-python-headless", # for headless testing of Qt
  "pre-commit",             # linting
  "pytest",                 # unit testing
  "pytest-cov",             # code coverage
  "pytest-env",             # environment defaults in tool.pytest.ini_options
  "pytest-timeout",         # per-tier hang guard in tests/spikesorting/v2
  "pytest-xdist",           # parallel workers; see tests/README.md
  "pytest-xvfb",            # for headless testing of Qt
  "tomli; python_version<'3.11'", # dependency-contract checks on Python 3.10
]
urls."Bug Tracker" = "https://github.com/LorenFrankLab/spyglass/issues"
urls."Homepage" = "https://github.com/LorenFrankLab/spyglass"
# Login has to work before a DataJoint session does: a new user may have no
# working config yet, and should not need to open Python to get a token.
scripts.spyglass-store = "spyglass.sharing.store_client:login_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# this file is created/updated when the package is installed and used in
# src/spyglass/__init__.py to set `spyglass.__version__`
version-file = "src/spyglass/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [ ".git_archival.txt" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/spyglass" ]
exclude = [  ]

[tool.black]
line-length = 80

[tool.ruff] # CB: Propose replacing flake8 with ruff to delete setup.cfg
line-length = 80
extend-exclude = [ ".claude", "notebooks/py_scripts" ]

lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [ "E402", "E501", "F401" ]

[tool.mypy]
files = [
  "src/spyglass/spikesorting/v2/_orchestration/types.py",
  "src/spyglass/spikesorting/v2/_recording/types.py",
  "src/spyglass/spikesorting/v2/matcher_protocol.py",
]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.ipynb,./docs/site/**,temp*,.claude,.claude/*'
ignore-words-list = 'nevers,notin,sortings,trough,sie'
# Nevers - name in Citation
# notin - UnitSelectionParams.unit_criteria operator, paired with isin
# sie - import alias for spikeinterface.exporters (not a typo of "size")

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
  "-s", # no capture
  # "-v", # verbose output
  # "--sw", # stepwise: resume with next test after failure
  # "--pdb", # drop into debugger on failure
  # "--no-teardown",  # don't teardown the database after tests
  # "--quiet-spy",   # don't show logging from spyglass
  # "--no-dlc",      # don't run DLC tests
  "--show-capture=no",
  "--pdbcls=IPython.terminal.debugger:TerminalPdb", # use ipython debugger
  "--doctest-modules",                              # run doctests in all modules
  "--cov=spyglass",
  "--cov-report=term-missing",
  "--no-cov-on-fail",
  # regenerate tests overwrite committed baselines; opt in with -m regenerate
  "-m", "not regenerate",
]
testpaths = [ "tests" ]
log_level = "INFO"
env = [
  "QT_QPA_PLATFORM = offscreen", # QT fails headless without this
  "DISPLAY = :0",                # QT fails headless without this
  "TF_ENABLE_ONEDNN_OPTS = 0",   # TF disable approx calcs
  "TF_CPP_MIN_LOG_LEVEL = 2",    # Disable TF warnings
]
filterwarnings = [
  # show warnings; ignore only known DataJoint and legacy-fixture noise
  "default",
  "ignore:pkg_resources is deprecated as an API:UserWarning:datajoint\\.plugin",
  "ignore::pyparsing.PyparsingDeprecationWarning:datajoint\\.declare",
  "ignore:Deprecated call to .*pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:The '(manufacturer|model_number|model_name)' field is deprecated:DeprecationWarning",
  "ignore:.*traces_cached_seg.*:ResourceWarning",
  "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning",
]
markers = [
  # Speed-based markers (based on total time: setup + call + teardown)
  "fast: Tests that complete in <1 second",
  "medium: Tests that complete in 1-10 seconds",
  "slow: Tests that complete in 10-60 seconds",
  "very_slow: Tests that complete in >60 seconds (top bottlenecks)",

  # Type-based markers
  "unit: Isolated helper tests; v2 unit tests use no DB or downloaded datasets",
  "integration: Integration tests involving multiple components",
  "io_heavy: I/O-intensive tests (database and/or NWB files)",
  "database: Tests requiring database operations",
  "nwb: Tests requiring NWB file I/O",

  # Special markers
  "serial: Tests that must run serially (not parallel-safe)",
  "regenerate: Tests that regenerate large on-disk fixtures (manual run only)",
  "acceptance: End-to-end acceptance probes; run only with --run-acceptance",
  "smoke: End-to-end v2 path check that also runs on every pull request",

  # v2 dependency tiers (see tests/README.md), independent of speed markers
  "db_unit: Metadata, lookup and schema checks without v2 stage computation",
  "stage: Exercise a materialized stage, browser/server, or native sorter",
  "pipeline: Exercise the complete sorting chain or session orchestration",
  "regression_gate: Heavy scientific, memory, acceptance or regeneration gate",
]

[tool.coverage.run] # NOTE: changes need to be mirrored in tests/.coveragerc
source = [ "*/src/spyglass/*" ]
relative_files = true # lets CI combine data from every job
omit = [ # which submodules have no tests
  "*/__init__.py",
  "*/_version.py",
  # "*/behavior/*",
  # "*/common/*",
  "*/data_import/*",
  "*/decoding/v0/*",
  # "*/decoding/*",
  "*/figurl_views/*",
  # "*/lfp/*",
  # "*/linearization/*",
  "*/lock/*",
  "*/mua/*",
  # "*/position/*",
  "*/ripple/*",
  "*/sharing/*",
  # "*/spikesorting/*",
  # "*/utils/*",
  "settings.py",
]

[tool.coverage.paths] # site-packages installs map onto src/ when combining
source = [ "src/spyglass", "*/site-packages/spyglass" ]
