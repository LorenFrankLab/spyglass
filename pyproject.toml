[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "spyglass-neuro"
description = "Neuroscience data analysis framework for reproducible research"
readme = "README.md"
keywords = [
  "data analysis",
  "datajoint",
  "electrophysiology",
  "kachery",
  "neuroscience",
  "nwb",
  "reproducible",
  "research",
  "sortingview",
  "spike sorting",
  "spikeinterface",
]
license = { file = "LICENSE" }
authors = [
  { name = "Loren Frank", email = "loren.frank@ucsf.edu" },
  { name = "Kyu Hyun Lee", email = "kyuhyun.lee@ucsf.edu" },
  { name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" },
  { name = "Ryan Ly", email = "rly@lbl.gov" },
  { name = "Daniel Gramling", email = "daniel.gramling@ucsf.edu" },
  { name = "Chris Brozdowski", email = "chris.broz@ucsf.edu" },
  { name = "Samuel Bray", email = "sam.bray@ucsf.edu" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [ "version" ]
dependencies = [
  "black[jupyter]>26",
  "bottleneck",
  "dask",
  "datajoint>=0.14.5,<2.0",
  "hdmf>=3.4.6",
  "ipympl",
  "matplotlib",
  "ndx-franklab-novela>=0.2.4",
  "ndx-ophys-devices",
  "ndx-optogenetics==0.3.0",
  "ndx-pose",
  "networkx",                       # imported by spikesorting v2 _matching.graph
  "non-local-detector==0.6.9",
  # NLD 0.6.9 uses the clip(a_min=..., a_max=...) keywords removed in JAX 0.10.
  # Keep the published detector API and test real fitting before moving these.
  "jax<0.10",
  "numba",                          # SI locally_exclusive peak detection
                                    # (clusterless) and burst-curation correlograms
  # The v2 SpikeInterface 0.104 stack pins numpy>=2 through the
  # `spikesorting-v2` / `spikesorting-v2-matching` extras; DeepLabCut 3.x and
  # keypoint-moseq 0.6 require numpy<2, so the base floor admits both lines.
  # Admitting numpy 1.x here does NOT select the legacy SpikeInterface lane:
  # that lane is still produced only by the pytest-legacy CI sed and
  # environments/environment_spikesorting_legacy.yml.
  "numpy>=1.26,<3",
  "opencv-python",
  "position-tools>=0.1",
  "probeinterface>=0.3.2",         # required by spikeinterface 0.104
  "pubnub<6.4",                    # TODO: remove this when sortingview is updated
  "pydantic>=2",                   # spikesorting v2 parameter models
  "pydotplus",
  "pynwb>=3.1.3",
  "ripple-detection>=1.7",         # spyglass.mua needs core.normalize_signal
                                   # and the detector's normalization params
  "scipy>=1.13",                   # imported at top level across common/lfp/
                                   # ripple/mua/decoding; floor matches the
                                   # conda environments
  "seaborn",
  "sortingview>=0.11",
  "spikeinterface==0.104.3",        # pinned: KS4/MS5/SC2/TDC2/Generic schemas
                                    # use extra="allow", so a SI bump silently
                                    # shifts untyped sorter defaults. Snapshot
                                    # tests (test_*_si_defaults_unchanged) fail
                                    # loudly on a bump; move the pin + audit the
                                    # diff together. Loosen only after a
                                    # deliberate SpikeInterface migration.
  "track-linearization>=2.3",
]

optional-dependencies.dlc = [
  "deeplabcut[tf]>=3.0", # floor only, so tf/numba need no pins of their own
  "ffmpeg",
]
optional-dependencies.docs = [
  "hatch",                  # Get version from env
  "jupytext",               # Convert notebooks to .py
  "mike",                   # Docs versioning
  "mkdocs",                 # Docs core
  "mkdocs-exclude",         # Docs exclude files
  "mkdocs-exclude-search",  # Docs exclude files in search
  "mkdocs-gen-files",       # Docs API generator
  "mkdocs-jupyter",         # Docs render notebooks
  "mkdocs-literate-nav",    # Dynamic page list for API docs
  "mkdocs-material",        # Docs theme
  "mkdocs-mermaid2-plugin", # Docs mermaid diagrams
  "mkdocstrings[python]",   # Docs API docstrings
]
optional-dependencies.kachery-cloud = [
  "kachery",
  "kachery-client",
  "kachery-cloud>=0.4",
]
optional-dependencies.moseq-cpu = [
  "jax[cpu]",
  "jax-moseq",
  "keypoint-moseq>=0.6",
]
optional-dependencies.moseq-gpu = [
  "jax[cuda12]",
  "jax-moseq[cuda12]",
  "keypoint-moseq>=0.6",
]
optional-dependencies.spikesorting-v2 = [
  # Staged-output cleanup extends AutoPopulate._populate1. Keep the v2 lane
  # on the lifecycle exercised by its transaction/rollback regression tests.
  "datajoint==0.14.9",
  # Cross-process locks for the shared analyzer cache
  # (_storage.analyzer_cache.analyzer_cache_lock) and recording, concat and motion
  # cache rebuilds.
  # Pure-Python and tiny; declared explicitly rather than relied on transitively
  # via torch. >=3.15: first release whose is_singleton lock reuses the live
  # instance without re-initializing it (analyzer_cache_lock relies on that for
  # same-thread reentrancy).
  "filelock>=3.15",
  # MS4 bundles its algorithm and supports the v2 NumPy-2 stack through the
  # dispatcher's scoped spikeextractors np.Inf compatibility shim. Pin the
  # native runtime exercised by the real-sort regression test.
  "mountainsort4==1.0.7",
  "mountainsort5>=0.5", # v2 alternative; pulls isosplit6 + scikit-learn
  # This extra's torch>=2 + SI 0.104 runtime resolves on the numpy-2 line.
  "numpy>=2,<3",
  # Drift/motion QC: DriftEstimate's default preset
  # (compute_motion preset="dredge_fast") requires torch. Pinned >=2 because
  # torch 2.x is the numpy>=2-compatible line -- this is NOT the UnitMatchPy
  # numpy<2 conflict (that one is UnitMatchPy's own reactive pin, not torch's;
  # see the spikesorting-v2-matching extra below). A modern standalone torch
  # coexists with the v2 numpy>=2 baseline.
  "torch>=2",
]
optional-dependencies.spikesorting-v2-matching = [
  # This extension can be installed independently; its v2 tables use the same
  # staged populate lifecycle as the main runtime extra.
  "datajoint==0.14.9",
  "filelock>=3.15", # existing-sort analyzer reads use the shared cache lock
  # cross-session unit tracking. Pinned to the 3.2.6/3.2.7 line, the last
  # release that declares ``numpy<3.0,>=2.0`` so its METADATA coexists with the
  # v2 numpy>=2 baseline (``uv pip check`` is clean against SI 0.104 + numpy 2).
  # 3.2.8+ (incl. all 3.3.x) reactively repinned to ``numpy<2.0`` per upstream
  # issue #134. CAVEAT: the metadata pin is necessary but not sufficient -- 3.2.7
  # still has a numpy-2 RUNTIME break in its metric path (``np.arange`` on
  # 1-element ``argwhere`` endpoints in ``param_functions``). The matcher backend
  # MUST install the scoped ``param_functions`` arange shim (see
  # spyglass.spikesorting.v2._matching.unitmatch_backend) or every run aborts.
  # Revisit when UnitMatchPy restores numpy>=2 support upstream.
  "UnitMatchPy>=3.2.6,<3.2.8",
  "mat73",                     # UnitMatchPy reads MATLAB .mat exports
  # UnitMatchPy 3.2.6/3.2.7 and the v2 SI stack it runs beside need numpy 2.
  "numpy>=2,<3",
]
optional-dependencies.spikesorting-v2-curation = [
  "datajoint==0.14.9", # existing v2 sorts use the staged populate lifecycle
  "filelock>=3.15", # shared analyzer locks and atomic draft revision checks
  # Pinned FigPack view/context APIs used by the Spyglass review extension.
  # Re-verify the browser edit/save/import journey before changing these pins.
  "figpack==0.3.20",
  "figpack-spike-sorting==0.1.14",
  "ipywidgets>=8,<9", # guided notebook preview, conflict resolution, and commit
]
optional-dependencies.spikesorting-v2-curation-test = [
  # Browser regression tests for the FigPack review journey (Python
  # Playwright drives a headless Chromium against the bundle served by
  # ``_review_delivery``). Test-only: never a runtime dependency. After
  # installing, run ``playwright install chromium`` (CI: ``--with-deps``).
  "playwright==1.55.0",
]
optional-dependencies.spikesorting-v2-validation = [
  # elephant is not declared directly -- it arrives through MEArec -- and it
  # requires numpy>=2.0.0, so this extra resolves on the numpy-2 line.
  "MEArec>=1.9",       # ground-truth simulated recordings
  "neuroconv[mearec]", # MEArec -> NWB conversion
  "nwbinspector",      # NWBInspector validation of the generated fixture NWB
]
optional-dependencies.test = [
  "codecov",                # for code coverage badge
  "docker",                 # for tests in a container
  "kachery",                # database access
  "kachery-client",
  "kachery-cloud>=0.4",
  "netcdf4",                # for decoding mocking
  "opencv-python-headless", # for headless testing of Qt
  "pre-commit",             # linting
  "pytest",                 # unit testing
  "pytest-cov",             # code coverage
  "pytest-env",             # environment defaults in tool.pytest.ini_options
  "pytest-xvfb",            # for headless testing of Qt
  "tomli; python_version<'3.11'", # dependency-contract checks on Python 3.10
]
urls."Bug Tracker" = "https://github.com/LorenFrankLab/spyglass/issues"
urls."Homepage" = "https://github.com/LorenFrankLab/spyglass"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# this file is created/updated when the package is installed and used in
# src/spyglass/__init__.py to set `spyglass.__version__`
version-file = "src/spyglass/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [ ".git_archival.txt" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/spyglass" ]
exclude = [  ]

[tool.black]
line-length = 80

[tool.ruff] # CB: Propose replacing flake8 with ruff to delete setup.cfg
line-length = 80
extend-exclude = [ ".claude", "notebooks/py_scripts" ]

lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [ "E402", "E501", "F401" ]

[tool.mypy]
# Start with the typed value/protocol boundary. Runtime schema modules and
# third-party scientific packages are intentionally outside this first gate.
files = [
  "src/spyglass/spikesorting/v2/_orchestration/types.py",
  "src/spyglass/spikesorting/v2/_recording/types.py",
  "src/spyglass/spikesorting/v2/matcher_protocol.py",
]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.ipynb,./docs/site/**,temp*,.claude,.claude/*'
ignore-words-list = 'nevers,notin,sortings,trough,sie'
# Nevers - name in Citation
# notin - UnitSelectionParams.unit_criteria operator, paired with isin
# sie - import alias for spikeinterface.exporters (not a typo of "size")

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
  "-s", # no capture
  # "-v", # verbose output
  # "--sw", # stepwise: resume with next test after failure
  # "--pdb", # drop into debugger on failure
  # "--no-teardown",  # don't teardown the database after tests
  # "--quiet-spy",   # don't show logging from spyglass
  # "--no-dlc",      # don't run DLC tests
  "--show-capture=no",
  "--pdbcls=IPython.terminal.debugger:TerminalPdb", # use ipython debugger
  "--doctest-modules",                              # run doctests in all modules
  "--cov=spyglass",
  "--cov-report=term-missing",
  "--no-cov-on-fail",
  # ``regenerate`` tests write large on-disk baseline bundles and
  # MUST NOT run in the default suite -- a path-selected default
  # run would silently overwrite committed baselines and any
  # subsequent comparison gate would compare today's output to
  # today's output (gate becomes a no-op). Opt in with
  # ``-m regenerate`` to deliberately regenerate.
  "-m", "not regenerate",
]
testpaths = [ "tests" ]
log_level = "INFO"
env = [
  "QT_QPA_PLATFORM = offscreen", # QT fails headless without this
  "DISPLAY = :0",                # QT fails headless without this
  "TF_ENABLE_ONEDNN_OPTS = 0",   # TF disable approx calcs
  "TF_CPP_MIN_LOG_LEVEL = 2",    # Disable TF warnings
]
filterwarnings = [
  # Keep new pipeline, dependency, NWB-validation and worker warnings visible.
  # These messages are known compatibility noise from the legacy fixture and
  # DataJoint's pkg_resources integration; suppress only their exact causes.
  "default",
  "ignore:pkg_resources is deprecated as an API:UserWarning:datajoint\\.plugin",
  "ignore::pyparsing.PyparsingDeprecationWarning:datajoint\\.declare",
  "ignore:Deprecated call to .*pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:The '(manufacturer|model_number|model_name)' field is deprecated:DeprecationWarning",
  "ignore:.*traces_cached_seg.*:ResourceWarning",
  "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning",
]
markers = [
  # Speed-based markers (based on total time: setup + call + teardown)
  "fast: Tests that complete in <1 second",
  "medium: Tests that complete in 1-10 seconds",
  "slow: Tests that complete in 10-60 seconds",
  "very_slow: Tests that complete in >60 seconds (top bottlenecks)",

  # Type-based markers
  "unit: Isolated helper tests; v2 unit tests use no DB or downloaded datasets",
  "integration: Integration tests involving multiple components",
  "io_heavy: I/O-intensive tests (database and/or NWB files)",
  "database: Tests requiring database operations",
  "nwb: Tests requiring NWB file I/O",

  # Special markers
  "serial: Tests that must run serially (not parallel-safe)",
  "regenerate: Tests that regenerate large on-disk fixtures (manual run only)",
  "acceptance: End-to-end acceptance probes; run only with --run-acceptance",

  # Every collected v2 test receives one tier from test_tiers.json or an
  # explicit marker. Collection checks its resolved fixture dependencies.
  # Speed markers remain independent: a stage may use no database, and a
  # package-scoped full pipeline still makes its consumer a pipeline test.
  "db_unit: Metadata, lookup and schema checks without v2 stage computation",
  "stage: Exercise a materialized stage, browser/server, or native sorter",
  "pipeline: Exercise the complete sorting chain or session orchestration",
  "regression_gate: Heavy scientific, memory, acceptance or regeneration gate",
]

[tool.coverage.run] # NOTE: changes need to be mirrored in tests/.coveragerc
source = [ "*/src/spyglass/*" ]
omit = [ # which submodules have no tests
  "*/__init__.py",
  "*/_version.py",
  # "*/behavior/*",
  # "*/common/*",
  "*/data_import/*",
  "*/decoding/v0/*",
  # "*/decoding/*",
  "*/figurl_views/*",
  # "*/lfp/*",
  # "*/linearization/*",
  "*/lock/*",
  "*/mua/*",
  # "*/position/*",
  "*/ripple/*",
  "*/sharing/*",
  # "*/spikesorting/*",
  # "*/utils/*",
  "settings.py",
]
