name: Lint
permissions:
  contents: read

on:
  push:
    branches:
      - '!documentation'
  pull_request:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Match the local pre-commit hook; all rules/exclusions live in pyproject.
      - run: python -m pip install ruff==0.14.13
      - run: ruff check .

  type-contracts:
    name: V2 type contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mypy==2.3.1 typing_extensions
      - run: mypy --config-file=pyproject.toml

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: psf/black@stable
        with:
          version: "26.1.0"

  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Codespell
        uses: codespell-project/actions-codespell@master
