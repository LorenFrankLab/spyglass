name: Test package building
permissions:
  contents: read
  pull-requests: write
  id-token: write

on:
  push:
    branches:
      - master
      - maint/*
      - '!test_branch'
      - '!documentation'
    tags:
      - "*"
  pull_request:
    branches:
      - master
      - maint/*
  workflow_dispatch: # Manually trigger with 'Run workflow' button
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: |
          pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - run: twine check dist/*
      - name: Upload sdist and wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build git archive
        run: mkdir archive && git archive -v -o archive/archive.tgz HEAD
      - name: Upload git archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: archive/
  test-package:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        package: ['wheel', 'sdist', 'archive']
    steps:
      - name: Download sdist and wheel artifacts
        if: matrix.package != 'archive'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download git archive artifact
        if: matrix.package == 'archive'
        uses: actions/download-artifact@v4
        with:
          name: archive
          path: archive/
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install build dependencies
        run: |
          pip install --upgrade setuptools wheel
          pip install --upgrade pip
      - name: Install wheel
        if: matrix.package == 'wheel'
        run: pip install dist/*.whl
      - name: Install sdist
        if: matrix.package == 'sdist'
        run: pip install dist/*.tar.gz
      - name: Install archive # requires tag
        if: matrix.package == 'archive' && startsWith(github.ref, 'refs/tags/')
        run: pip install archive/archive.tgz
      # The resolver can install a jax/numpy/spikeinterface combination that
      # imports individually but not together. Not a cold `import
      # spyglass.decoding`: that activates DataJoint schemas and needs a DB.
      # TODO(#1609): revisit with the SpikeInterface bump.
      - name: Smoke test installed dependency stack
        if: matrix.package != 'archive' || startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "
          import jax, numpy, scipy, spikeinterface
          print('jax', jax.__version__)
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('spikeinterface', spikeinterface.__version__)

          import non_local_detector
          from non_local_detector import ContFragClusterlessClassifier
          print('non_local_detector', non_local_detector.__version__)
          ContFragClusterlessClassifier()
          print('classifier construction OK')

          # Construction alone misses detector/JAX runtime incompatibilities.
          import tempfile
          from pathlib import Path
          from non_local_detector import ContFragSortedSpikesClassifier
          from non_local_detector.environment import Environment
          t = numpy.arange(0, 10, 0.05)
          data = dict(position_time=t, position=(50 + 40 * numpy.sin(t / 3))[:, None],
                      spike_times=[numpy.arange(0.5, 9.5, 0.7)])
          model = ContFragSortedSpikesClassifier(
              sampling_frequency=20, environments=Environment(place_bin_size=10),
              sorted_spikes_algorithm_params={'position_std': 8.0, 'block_size': 1000})
          model.fit(**data)
          result = model.predict(**data, time=t)
          with tempfile.TemporaryDirectory() as directory:
              results_path = Path(directory) / 'results.nc'
              model_path = Path(directory) / 'model.pkl'
              model.save_results(result, results_path)
              model.save_model(model_path)
              restored = model.load_model(model_path)
              numpy.testing.assert_allclose(
                  restored.predict(**data, time=t).acausal_posterior.sum('state_bins'), 1, atol=1e-5)
              numpy.testing.assert_allclose(
                  model.load_results(results_path).acausal_posterior, result.acausal_posterior)
          print('real detector fit/predict/save/reload OK')
          "
  publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [test-package]
    environment:
      name: pypi
      url: https://pypi.org/p/spyglass-neuro
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
