name: Tests
permissions:
  contents: read

on:
  push:
    branches:
      - '!test_branch'
      - '!documentation'
  schedule:  # once a day at midnight UTC
    - cron: '0 0 * * *'
  pull_request: # requires approval for first-time contributors
    types: [synchronize, opened, reopened, labeled, closed]
  workflow_dispatch: # Manually trigger with 'Run workflow' button
    inputs:
      test_mode:
        description: 'Test mode (fast or full)'
        required: false
        default: 'full'
        type: choice
        options:
          - fast
          - full

concurrency: # Replace Cancel Workflow Action
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    # Skip if PR is closed but not merged
    if: |-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 90  # backstop; the step caps below are the real limits
    defaults:
     run:
       shell: bash -el {0}
    env:
      OS: ubuntu-latest
      PYTHON: '3.10'
    services:
      mysql:
        image: datajoint/mysql:8.0
        # args: mysql -h 127.0.0.1 -P 3308 -uroot -ptutorial -e "CMD;"
        env:
          MYSQL_DATABASE: localhost
          MYSQL_ROOT_PASSWORD: tutorial
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v4
    - name: Set up Python
      timeout-minutes: 5
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON }}
    - name: Set up conda
      timeout-minutes: 20
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: spyglass
        environment-file: environments/environment.yml
        miniforge-version: latest
        use-mamba: true
    - name: Install apt dependencies
      timeout-minutes: 40
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Bound each attempt: the Azure mirror can accept a connection and
        # never answer, and more retries multiply that wait
        APT_OPTS="-o Acquire::http::Timeout=30"
        APT_OPTS="$APT_OPTS -o Acquire::https::Timeout=30"
        APT_OPTS="$APT_OPTS -o Acquire::Retries=1"
        sudo apt-get update $APT_OPTS
        # libsm6/libxext6 are opencv-python's
        sudo apt-get install -y $APT_OPTS \
          mysql-client libmysqlclient-dev libgirepository1.0-dev \
          ffmpeg libsm6 libxext6
    - name: Run pip install for test deps
      timeout-minutes: 15
      run: |
        pip install --quiet .[test,spikesorting]
    - name: Cache test data
      timeout-minutes: 10
      id: cache-test-data
      uses: actions/cache@v4
      with:
        path: |
          tests/_data/raw/
          tests/_data/video/
        key: |-
          test-data-${{ hashFiles('.github/workflows/test-conda.yml') }}-v1
        restore-keys: |
          test-data-
    - name: Download data
      timeout-minutes: 20
      if: steps.cache-test-data.outputs.cache-hit != 'true'
      env:
        BASEURL: https://ucsf.box.com/shared/static/
        NWB_URL: k3sgql6z475oia848q1rgms4zdh4rkjn.nwb
        VID1URL: ykep8ek4ogad20wz4p0vuyuqfo60cv3w.h264
        VID2URL: d2jjk0y565ru75xqojio3hymmehzr5he.h264
        NWBFILE: minirec20230622.nwb
        VID_ONE: 20230622_minirec_01_s1.1.h264
        VID_TWO: 20230622_minirec_02_s2.1.h264
        RAW_DIR: /home/runner/work/spyglass/spyglass/tests/_data/raw/
        VID_DIR: /home/runner/work/spyglass/spyglass/tests/_data/video/
      run: |
        mkdir -p $RAW_DIR $VID_DIR
        curl_opts() { # Download $3 to $1$2
          # --fail: an HTTP error fails the step; .part: never cache a partial file
          curl --fail -L --output "$1$2.part" "$BASEURL$3" \
            || { rm -f "$1$2.part"; return 1; }
          mv "$1$2.part" "$1$2"
        }
        curl_opts $RAW_DIR $NWBFILE $NWB_URL
        curl_opts $VID_DIR $VID_ONE $VID1URL
        curl_opts $VID_DIR $VID_TWO $VID2URL
    - name: Move actions coveragerc
      timeout-minutes: 2
      run: mv tests/.coveragerc .coveragerc
    - name: Determine test mode
      timeout-minutes: 2
      id: test_mode
      run: |
        # Determine which tests to run based on trigger
        if [[ "${{ github.event_name }}" == "push" ]]; then
          # Fast tests on push
          echo "mode=fast" >> $GITHUB_OUTPUT
          echo "marker_args=-m 'not slow and not very_slow'" \
            >> $GITHUB_OUTPUT
          echo "description=Fast tests" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "pull_request" ]] \
          && [[ "${{ github.event.action }}" == "closed" ]] \
          && [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
          # Full suite on PR merge
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "marker_args=" >> $GITHUB_OUTPUT
          echo "description=Full test suite" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # Manual trigger - use input
          if [[ "${{ github.event.inputs.test_mode }}" == "fast" ]]; then
            echo "mode=fast" >> $GITHUB_OUTPUT
            echo "marker_args=-m 'not slow and not very_slow'" \
              >> $GITHUB_OUTPUT
            echo "description=Fast tests (manual)" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "marker_args=" >> $GITHUB_OUTPUT
            echo "description=Full suite (manual)" >> $GITHUB_OUTPUT
          fi
        else
          # Full suite for schedule and other PR events
          # (synchronize, opened, etc.)
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "marker_args=" >> $GITHUB_OUTPUT
          echo "description=Full test suite" >> $GITHUB_OUTPUT
        fi
    - name: Run tests (${{ steps.test_mode.outputs.description }})
      timeout-minutes: 45
      run: |
        # --base-dir matches the conftest default (./tests/_data/) and the
        # path covered by the cache-test-data step above. Pinned explicitly
        # so cache hits are stable across any future conftest default change.
        # Spike sorting suites run in pytest-v2 and pytest-legacy.
        pytest --no-docker --no-dlc --base-dir ./tests/_data/ \
          --cov-config=.coveragerc --cov=spyglass-neuro --cov-report=xml \
          ${{ steps.test_mode.outputs.marker_args }} \
          --ignore=tests/spikesorting/v0 \
          --ignore=tests/spikesorting/v1 \
          --ignore=tests/spikesorting/v2 \
          tests/
    # Spike sorting jobs upload their own coverage reports below.
    - name: Upload coverage reports to Codecov
      timeout-minutes: 10
      if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        flags: ${{ steps.test_mode.outputs.mode }}-tests
        name: ${{ steps.test_mode.outputs.description }}

  pytest-v2: # Spikesorting V2
    name: pytest-v2 ${{ matrix.shard.name }} (SpikeInterface 0.104)
    # Skip if PR is closed but not merged
    if: |-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    # Shards are balanced by runtime; separate-env lanes run beside them.
    # New full-sort test file: add it to INTEGRATION_MODULES in run_ci_shard.py.
    env:
      # CPU torch wheels; the CUDA ones have filled the runner disk.
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"name":"single-session"},{"name":"integration"},{"name":"unit"},{"name":"matching"},{"name":"curation"},{"name":"motion-benchmark"}]'
          || '[{"name":"single-session"},{"name":"integration"},{"name":"unit"},{"name":"matching"},{"name":"curation"}]') }}
    # Playwright 1.55 cannot install Chromium on ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    services:
      mysql:
        image: datajoint/mysql:8.0
        env:
          MYSQL_DATABASE: localhost
          MYSQL_ROOT_PASSWORD: tutorial
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmysqlclient-dev
    - name: Set up conda (SpikeInterface 0.104 environment)
      # NEURON/LFPy are only for generating fixtures, which this job downloads.
      # The matching extra gets its own env in a later step.
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: spyglass_spikesorting_v2
        environment-file: environments/environment_spikesorting_v2.yml
        miniforge-version: latest
        use-mamba: true
    - name: Verify the v2 environment (pip check + sorter runtime)
      # Run a sorter, not just import it.
      run: |
        pip check
        python - <<'EOF'
        import spikeinterface as si
        import spikeinterface.sorters as sis
        assert "mountainsort5" in sis.installed_sorters(), sis.installed_sorters()
        import mountainsort4
        assert callable(mountainsort4.mountainsort4)
        rec = si.generate_recording(num_channels=4, durations=[2.0], sampling_frequency=30000.0)
        sorting = sis.run_sorter("mountainsort5", rec, folder="/tmp/ms5_smoke", remove_existing_folder=True, filter=False, whiten=True)
        print("mountainsort5 runtime ok:", sorting)
        EOF
    - name: Cache downloaded MEArec fixtures
      # Keyed per event so PR (smoke only) and nightly/manual caches stay apart.
      uses: actions/cache@v4
      with:
        path: tests/spikesorting/v2/fixtures/*.nwb
        key: v2-fixtures-${{ github.event_name }}-${{ hashFiles('tests/spikesorting/v2/fixtures/fixtures_manifest.json', 'tests/spikesorting/v2/fixtures/_fetch.py') }}
    - name: Download smoke fixture (canonical artifact from Box)
      # No regeneration fallback: a hash mismatch or bad URL must fail the job.
      # Larger fixtures download only on scheduled or manual runs.
      run: |
        python tests/spikesorting/v2/fixtures/_fetch.py mearec_polymer_smoke
    - name: Download 60s polymer fixture (scheduled / manual full runs)
      # Un-skips the merge frame-equality, MS5 ground-truth and clusterless
      # sparse-id tests.
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        python tests/spikesorting/v2/fixtures/_fetch.py mearec_polymer_128ch_60s
    - name: Download scenario fixtures (manual dispatch only)
      # Neuropixels and tetrode fixtures change rarely: manual dispatch only.
      if: github.event_name == 'workflow_dispatch'
      run: |
        python tests/spikesorting/v2/fixtures/_fetch.py mearec_neuropixels_60s
        python tests/spikesorting/v2/fixtures/_fetch.py mearec_tetrode_60s
    - name: Cache the real tetrode session (scheduled / manual runs)
      id: cache-minirec
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/cache@v4
      with:
        # Not the shared ``test-data-`` key: this subset would give run-tests and
        # pytest-legacy an incomplete cache.
        path: |
          tests/_data/raw/minirec20230622.nwb
          tests/_data/video/
        key: v2-minirec-${{ hashFiles('.github/workflows/test-conda.yml') }}
    - name: Download the real tetrode session (scheduled / manual runs)
      # Real tetrode with x-z plane contacts, for single_session/test_recording.py.
      # Ingestion also needs its ImageSeries videos.
      if: |-
        (github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch')
        && steps.cache-minirec.outputs.cache-hit != 'true'
      env:
        BASEURL: https://ucsf.box.com/shared/static/
        NWB_URL: k3sgql6z475oia848q1rgms4zdh4rkjn.nwb
        VID1URL: ykep8ek4ogad20wz4p0vuyuqfo60cv3w.h264
        VID2URL: d2jjk0y565ru75xqojio3hymmehzr5he.h264
        NWBFILE: minirec20230622.nwb
        VID_ONE: 20230622_minirec_01_s1.1.h264
        VID_TWO: 20230622_minirec_02_s2.1.h264
        RAW_DIR: /home/runner/work/spyglass/spyglass/tests/_data/raw/
        VID_DIR: /home/runner/work/spyglass/spyglass/tests/_data/video/
      run: |
        mkdir -p $RAW_DIR $VID_DIR
        curl_opts() { # Download $3 to $1$2
          # --fail: an HTTP error fails the step; .part: never cache a partial file
          curl --fail -L --output "$1$2.part" "$BASEURL$3" \
            || { rm -f "$1$2.part"; return 1; }
          mv "$1$2.part" "$1$2"
        }
        curl_opts $RAW_DIR $NWBFILE $NWB_URL
        curl_opts $VID_DIR $VID_ONE $VID1URL
        curl_opts $VID_DIR $VID_TWO $VID2URL
    - name: Select required fixtures for this run
      # conftest fails the session if a named fixture is missing.
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          REQ="mearec_polymer_smoke mearec_polymer_128ch_60s mearec_neuropixels_60s mearec_tetrode_60s minirec20230622"
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          REQ="mearec_polymer_smoke mearec_polymer_128ch_60s minirec20230622"
        else
          REQ="mearec_polymer_smoke"
        fi
        echo "SPYGLASS_V2_REQUIRE_FIXTURES=$REQ" >> "$GITHUB_ENV"
    - name: Select the v2 test tiers for this run
      # Push and PR: unit, db_unit and smoke tests. Schedule and dispatch: all.
      # A later ``-m`` replaces pyproject's, so repeat ``not regenerate``.
      run: |
        if [ "${{ github.event_name }}" = "push" ] || \
           [ "${{ github.event_name }}" = "pull_request" ]; then
          MARKERS="(unit or db_unit or smoke) and not regenerate"
        else
          MARKERS="not regenerate"
        fi
        echo "V2_MARKERS=$MARKERS" >> "$GITHUB_ENV"
    - name: Run modern spike-sorting tests
      if: contains(fromJSON('["single-session", "integration", "unit"]'), matrix.shard.name)
      # Shard contents: tests/spikesorting/v2/scripts/run_ci_shard.py.
      run: |
        # DB-free unit tier on xdist workers, then DB tiers serially; fail if either
        # fails. Per-shard XML because later lanes overwrite .coverage.
        shard=${{ matrix.shard.name }}
        common=(--no-docker --no-dlc -q --v2-tier-budgets --durations=25
                --cov-config=tests/.coveragerc)
        unit_status=0
        db_status=0
        python tests/spikesorting/v2/scripts/run_ci_shard.py "$shard" \
          --v2-tier unit -m "not regenerate" -n auto "${common[@]}" \
          --junitxml="junit-v2-$shard-unit.xml" --cov-report= \
          || unit_status=$?
        python tests/spikesorting/v2/scripts/run_ci_shard.py "$shard" \
          -m "($V2_MARKERS) and not unit" "${common[@]}" --cov-append \
          --junitxml="junit-v2-$shard.xml" \
          --cov-report="xml:coverage-v2-$shard.xml" || db_status=$?
        echo "unit tier exit $unit_status; database tiers exit $db_status"
        [ "$unit_status" -eq 0 ] && [ "$db_status" -eq 0 ]
    - name: Upload v2 shard coverage to Codecov
      if: ${{ !cancelled() && contains(fromJSON('["single-session", "integration", "unit"]'), matrix.shard.name) && hashFiles(format('coverage-v2-{0}.xml', matrix.shard.name)) != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-${{ matrix.shard.name }}.xml
        disable_search: true
        flags: spikesorting-v2-${{ matrix.shard.name }}
        name: Spike sorting v2 ${{ matrix.shard.name }}
    # --- Matching extra (own env); asserts the resolver keeps numpy>=2.
    - name: Matching-extra resolver evidence (separate env)
      if: matrix.shard.name == 'matching'
      env:
        # Missing extras fail the test instead of skipping it.
        SPIKESORTING_V2_MATCHING_EXTRA_REQUIRED: "1"
      run: |
        conda create -y -n spyglass_v2_matching python=3.11
        # Tolerate transient install failures; the flag above still fails the test
        # if deps are missing. Never mask the pytest run.
        conda run -n spyglass_v2_matching pip install \
          -e ".[test,spikesorting-v2,spikesorting-v2-matching]" || true
        # Only env with UnitMatchPy: owns matcher tests and the cross-session notebook.
        # No ``|| true``: a missing smoke fixture must fail, not skip the match path.
        conda run -n spyglass_v2_matching python \
          tests/spikesorting/v2/fixtures/_fetch.py mearec_polymer_smoke
        conda run -n spyglass_v2_matching pytest -m "$V2_MARKERS" \
          --v2-tier-budgets --durations=25 \
          --junitxml=junit-v2-matching.xml \
          tests/spikesorting/v2/test_v1_parity.py::test_optional_matching_extra_resolution \
          tests/spikesorting/v2/test_unitmatch.py \
          tests/spikesorting/v2/test_unitmatch_concat.py \
          tests/spikesorting/v2/test_unitmatch_backend.py \
          tests/spikesorting/v2/test_unitmatch_daily_concat.py \
          tests/spikesorting/v2/test_direct_curation_unitmatch.py \
          tests/spikesorting/v2/test_motion_consumers.py::test_unitmatch_bundle_of_a_corrected_sort \
          tests/spikesorting/v2/test_motion_consumers.py::test_corrected_concat_bundle_keeps_windows_in_spans \
          tests/spikesorting/v2/test_notebook_execution.py::test_cross_session_notebook_runs \
          --no-docker --no-dlc -q --cov-config=tests/.coveragerc \
          --cov-report=xml:coverage-v2-matching.xml
    - name: Upload matching coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-v2-matching.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-matching.xml
        disable_search: true
        flags: spikesorting-v2-matching
        name: Spike sorting v2 matching
    # --- Matcher ground truth: red until the 2sessions_{s1,s2} fixtures are
    # hosted (_fetch.py URLs are None). Do not mask the failure.
    - name: Two-session matcher ground-truth gate (nightly / manual dispatch)
      if: matrix.shard.name == 'matching' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      run: |
        SPYGLASS_V2_REQUIRE_FIXTURES="mearec_polymer_128ch_2sessions_s1 mearec_polymer_128ch_2sessions_s2" \
          conda run -n spyglass_v2_matching pytest \
          tests/spikesorting/v2/test_unitmatch.py::test_v2_unitmatch_polymer_mearec_ground_truth \
          --no-docker --no-dlc -q --cov-config=tests/.coveragerc \
          --cov-report=xml:coverage-v2-matching-ground-truth.xml
    - name: Upload matcher ground-truth coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-v2-matching-ground-truth.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-matching-ground-truth.xml
        disable_search: true
        flags: spikesorting-v2-matching-ground-truth
        name: Spike sorting v2 matcher ground truth
    # --- Motion benchmark: development evidence with no pass/fail limits,
    # ~50 min, so manual dispatch only.
    - name: Motion-correction development benchmark (manual dispatch only)
      if: matrix.shard.name == 'motion-benchmark'
      run: |
        SPYGLASS_V2_MOTION_BENCHMARK=1 \
        SPYGLASS_V2_MOTION_BENCHMARK_OUT="$RUNNER_TEMP/motion-benchmark-development" \
        SPYGLASS_V2_REQUIRE_FIXTURES="mearec_polymer_128ch_drift_120s" \
          pytest tests/spikesorting/v2/test_motion_acceptance.py \
          --no-docker --no-dlc -q --cov-config=tests/.coveragerc \
          --cov-report=xml:coverage-v2-motion-benchmark.xml
    - name: Upload motion benchmark coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-v2-motion-benchmark.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-motion-benchmark.xml
        disable_search: true
        flags: spikesorting-v2-motion-benchmark
        name: Spike sorting v2 motion benchmark
    - name: Upload the motion benchmark evidence (manual dispatch only)
      # always(): publish partial results from failed or timed-out runs.
      if: ${{ always() && matrix.shard.name == 'motion-benchmark' }}
      uses: actions/upload-artifact@v4
      with:
        name: motion-benchmark-development
        path: ${{ runner.temp }}/motion-benchmark-development
        if-no-files-found: error
    # --- FigPack curation extra, in its own env like the matching lane.
    - name: FigPack curation tests (separate env)
      if: matrix.shard.name == 'curation'
      run: |
        conda create -y -n spyglass_v2_curation python=3.11
        # No ``|| true``: a failed install must fail, not leave figpack tests skipping.
        conda run -n spyglass_v2_curation pip install \
          -e ".[test,spikesorting-v2,spikesorting-v2-curation,spikesorting-v2-curation-test]"
        # Chromium for the Playwright browser tests.
        conda run -n spyglass_v2_curation playwright install --with-deps chromium
        conda run -n spyglass_v2_curation python \
          tests/spikesorting/v2/fixtures/_fetch.py mearec_polymer_smoke
        # Missing figpack/playwright/browser fails the browser tests, not skips.
        SPYGLASS_REQUIRE_BROWSER_TESTS=1 conda run -n spyglass_v2_curation pytest \
          -m "$V2_MARKERS" --v2-tier-budgets --durations=25 \
          --junitxml=junit-v2-curation.xml \
          tests/spikesorting/v2/test_figpack_curation_integration.py \
          tests/spikesorting/v2/test_review_api_integration.py \
          tests/spikesorting/v2/test_review_delivery.py \
          tests/spikesorting/v2/test_review_unit_properties.py \
          tests/spikesorting/v2/test_review_inspection.py \
          tests/spikesorting/v2/test_review_browser.py \
          tests/spikesorting/v2/test_review_browser_journey.py \
          tests/spikesorting/v2/test_user_curation_workflow.py \
          tests/spikesorting/v2/test_epoch_unitmatch.py \
          tests/spikesorting/v2/test_notebook_execution.py::test_curation_notebook_runs \
          --no-docker --no-dlc -q --cov-config=tests/.coveragerc \
          --cov-report=xml:coverage-v2-curation.xml
    - name: Upload curation coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-v2-curation.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-curation.xml
        disable_search: true
        flags: spikesorting-v2-curation
        name: Spike sorting v2 curation
    # --- Acceptance probes (nightly/manual, curation env): too slow per push.
    # test_database_and_file_restore skips: no Docker client for its restore.
    - name: End-to-end acceptance probes (nightly / manual dispatch)
      if: matrix.shard.name == 'curation' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      run: |
        SPYGLASS_V2_REQUIRE_FIXTURES="mearec_tetrode_60s mearec_polymer_smoke" \
          conda run -n spyglass_v2_curation pytest \
          tests/spikesorting/v2/acceptance --run-acceptance --no-docker --no-dlc -q \
          --cov-config=tests/.coveragerc \
          --cov-report=xml:coverage-v2-acceptance.xml
    - name: Upload acceptance coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-v2-acceptance.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-v2-acceptance.xml
        disable_search: true
        flags: spikesorting-v2-acceptance
        name: Spike sorting v2 acceptance
    - name: Upload v2 test reports
      # Per-test durations, to track cost across runs; includes failed runs.
      if: ${{ always() && hashFiles('junit-v2-*.xml') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: junit-v2-${{ matrix.shard.name }}
        path: junit-v2-*.xml

  v2-supported-python:
    # Supported Python endpoints (the full suite uses 3.11), without MySQL or fixtures.
    name: v2 Python ${{ matrix.python-version }} smoke
    if: |-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install v2 runtime and focused test dependencies
      run: |
        # CPU-only torch wheel, so the extra does not pull CUDA packages.
        python -m pip install "torch>=2" \
          --index-url https://download.pytorch.org/whl/cpu
        python -m pip install ".[spikesorting-v2]" pytest pytest-env tomli
        python -m pip check
    - name: Check public and scientific contracts without the DB harness
      run: |
        python -m pytest --noconftest -o addopts='' -q \
          tests/spikesorting/v2/test_dependency_contract.py \
          tests/spikesorting/v2/test_pipeline_facade.py \
          tests/spikesorting/v2/test_service_import_contracts.py::test_pipeline_type_contracts_are_reexported_from_facade \
          tests/spikesorting/v2/test_params_validation.py::test_preprocessing_non_default_blob_round_trips \
          tests/spikesorting/v2/test_preprocessing_order.py \
          tests/spikesorting/v2/test_signal_math.py \
          tests/spikesorting/v2/test_mountainsort4_runtime.py
    - name: Exercise the installed v2 sorter runtime
      run: python tests/spikesorting/v2/scripts/smoke_supported_python.py

  pytest-legacy:
    # v0/v1 tests need SpikeInterface 0.99 (_require_legacy_si_environment).
    name: pytest-legacy (SpikeInterface 0.99)
    # Skip if PR is closed but not merged
    if: |-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    services:
      mysql:
        image: datajoint/mysql:8.0
        env:
          MYSQL_DATABASE: localhost
          MYSQL_ROOT_PASSWORD: tutorial
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install apt dependencies
      run: |
        sudo apt-get update
        # mysql for DataJoint; ffmpeg/libsm6/libxext6 for the minirec videos.
        sudo apt-get install -y \
          mysql-client libmysqlclient-dev ffmpeg libsm6 libxext6
    - name: Pin SpikeInterface to the legacy 0.99 line (coherent resolve)
      # Relax the SI pins in this checkout so the env resolves SI 0.99 in one pass;
      # downgrading after a 0.104 install leaves an incompatible numpy 2 set.
      run: |
        sed -i \
          -e 's/"spikeinterface==0.104.3"/"spikeinterface>=0.99.1,<0.100"/' \
          -e 's/"probeinterface>=0.3.2"/"probeinterface>=0.2.19,<0.3"/' \
          pyproject.toml
        grep -nE '"(spikeinterface|probeinterface|numpy)' pyproject.toml
    - name: Set up conda (legacy SpikeInterface 0.99 environment)
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: spyglass_spikesorting_legacy
        environment-file: environments/environment_spikesorting_legacy.yml
        miniforge-version: latest
        use-mamba: true
    - name: Verify the legacy SI-0.99 stack resolved coherently
      # SI <0.100: 0.100.x broke NwbRecordingExtractor timestamps.
      run: |
        python - <<'PY'
        from packaging.version import Version
        import spikeinterface as si
        import probeinterface as pi
        import numpy as np
        print("SI", si.__version__, "| probeinterface", pi.__version__,
              "| numpy", np.__version__)
        assert Version(si.__version__) < Version("0.100"), si.__version__
        assert Version(pi.__version__) < Version("0.3"), pi.__version__
        assert Version(np.__version__) < Version("2"), np.__version__
        PY
    - name: Cache test data
      id: cache-test-data
      uses: actions/cache@v4
      with:
        # Same key as run-tests, so minirec downloads at most once.
        path: |
          tests/_data/raw/
          tests/_data/video/
        key: |-
          test-data-${{ hashFiles('.github/workflows/test-conda.yml') }}-v1
        restore-keys: |
          test-data-
    - name: Download data
      if: steps.cache-test-data.outputs.cache-hit != 'true'
      env:
        BASEURL: https://ucsf.box.com/shared/static/
        NWB_URL: k3sgql6z475oia848q1rgms4zdh4rkjn.nwb
        VID1URL: ykep8ek4ogad20wz4p0vuyuqfo60cv3w.h264
        VID2URL: d2jjk0y565ru75xqojio3hymmehzr5he.h264
        NWBFILE: minirec20230622.nwb
        VID_ONE: 20230622_minirec_01_s1.1.h264
        VID_TWO: 20230622_minirec_02_s2.1.h264
        RAW_DIR: /home/runner/work/spyglass/spyglass/tests/_data/raw/
        VID_DIR: /home/runner/work/spyglass/spyglass/tests/_data/video/
      run: |
        mkdir -p $RAW_DIR $VID_DIR
        curl_opts() { # Download $3 to $1$2
          # --fail: an HTTP error fails the step; .part: never cache a partial file
          curl --fail -L --output "$1$2.part" "$BASEURL$3" \
            || { rm -f "$1$2.part"; return 1; }
          mv "$1$2.part" "$1$2"
        }
        curl_opts $RAW_DIR $NWBFILE $NWB_URL
        curl_opts $VID_DIR $VID_ONE $VID1URL
        curl_opts $VID_DIR $VID_TWO $VID2URL
    - name: Move actions coveragerc
      run: mv tests/.coveragerc .coveragerc
    - name: Run legacy spike-sorting tests
      run: |
        # This v2 file holds the legacy-environment guard test (its v2 cases skip).
        pytest tests/spikesorting/v0 tests/spikesorting/v1 \
          tests/spikesorting/v2/test_clusterless_waveform_features.py \
          --no-docker --no-dlc --base-dir ./tests/_data/ -q \
          --cov-config=.coveragerc --cov-report=xml:coverage-legacy.xml
    - name: Upload legacy coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage-legacy.xml') != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-legacy.xml
        disable_search: true
        flags: spikesorting-legacy
        name: Spike sorting legacy
